name: Build
description: Stub action for multi-platform builds

inputs:
  linuxEnabled:
    type: boolean
    default: true
  windowsEnabled:
    type: boolean
    default: true
  linuxCacheOnly:
    type: boolean
    default: false
  windowsCacheOnly:
    type: boolean
    default: false

runs:
  using: "composite"
  steps:


  - name: Build (Linux)
    if: runner.os == 'Linux' && inputs.linuxEnabled == 'true'
    uses: "./.github/workflows/build/linux"
    with:
      cacheOnly: ${{ inputs.linuxCacheOnly }}

  - name: Build (OSX)
    if: runner.os == 'MacOS'
    uses: "./.github/workflows/build/osx"

  - name: Build (Windows)
    if: runner.os == 'Windows' && inputs.windowsEnabled == 'true'
    uses: "./.github/workflows/build/windows"
    with:
      cacheOnly: ${{ inputs.windowsCacheOnly }}
