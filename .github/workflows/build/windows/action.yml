name: Build
description: Build Windows artifacts

inputs:
  cacheOnly:
    type: boolean
    default: false
  msvcVersion:
    type: string
    default: '19.44'
    required: true

runs:
  using: "composite"
  steps:

  - uses: actions/setup-python@v5
    with:
      python-version:  ${{ env.pythonVersion }}

  - name: Install Downgraded MSVC
    shell: powershell
    run: |
      # For versions update see here: https://learn.microsoft.com/en-us/visualstudio/install/workload-component-id-vs-build-tools?view=vs-2022
      Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
      $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
      $componentsToInstall= @(
      "Microsoft.VisualStudio.Component.VC.${{ inputs.msvcVersion }}.x86.x64"
      "Microsoft.VisualStudio.Component.VC.${{ inputs.msvcVersion }}.ATL"
      )
      [string]$workloadArgs = $componentsToInstall | ForEach-Object {" --add " +  $_}
      $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"",$workloadArgs, '--quiet', '--norestart', '--nocache')
      # should be run twice
      $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
      $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden

  - name: Setup cmake
    uses: jwlawson/actions-setup-cmake@v2
    with:
      cmake-version: '3.x'

  - name: Install Python Dependencies
    shell: bash
    run: pip3 install py7zr==1.1.0 aqtinstall conan

#  - name: Retrieve Qt Cache
#    id: cache-qt
#    uses: actions/cache@v4
#    with:
#      key: windows-qt-${{ env.qtVersion }}
#      path: ${{ runner.temp }}\qt

  - name: Install Qt
#    if: ${{ steps.cache-qt.outputs.cache-hit != 'true' }}
    shell: bash
    run: |
      aqt install-qt --outputdir ${RUNNER_TEMP}/qt windows desktop ${{ env.qtVersion }} win64_msvc2019_64 -m all

  - name: Setup MSVC Compiler
    uses: ilammy/msvc-dev-cmd@v1
    with:
      toolset: ${{ inputs.msvcVersion }}

  - name: Build Frontend
    shell: bash
    run: |
      cd frontend

      Qt6_DIR="${RUNNER_TEMP}\qt\${{ env.qtVersion }}\msvc2019_64"

      mkdir build && cd build

      cmake ../ -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      #cmake --preset ci-windows
      #cmake --build --preset build

  - name: Deploy Runtime Libs
    shell: bash
    run: |
      cd frontend/build/bin
      windeployqt.exe jv2.exe

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: ${{ env.pythonVersion }}

  - name: Build Backend
    shell: bash
    run: |
      set -ex

      python3 -m pip install nuitka

      cd backend
      cp pyproject.toml.win pyproject.toml
      python3 -m pip install .

      python3 -m nuitka --standalone --onefile --assume-yes-for-downloads src/jv2backend

  - name: Upload Raw Build Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: windows-build
      path: |
        ${{ github.workspace }}\frontend\build\bin
        ${{ github.workspace }}\backend
      if-no-files-found: error

