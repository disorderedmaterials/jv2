name: Build
description: Build Windows artifacts

inputs:
  cacheOnly:
    type: boolean
    default: false

runs:
  using: "composite"
  steps:

  - name: Install Chocolatey Dependencies
    shell: bash
    run: choco install -y ninja

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Python Dependencies
    shell: bash
    run: pip3 install aqtinstall

  - name: Retrieve Qt Cache
    id: cache-qt
    uses: actions/cache@v4
    with:
      key: windows-qt-${{ env.qtVersion }}
      path: ${{ runner.temp }}\qt

  - name: Install Qt
    if: ${{ steps.cache-qt.outputs.cache-hit != 'true' }}
    shell: bash
    run: |
      aqt install-qt --outputdir ${RUNNER_TEMP}\qt windows desktop ${{ env.qtVersion }} win64_msvc2019_64 -m all

  - name: Remove /usr/bin/link
    shell: bash
    run: |
      echo "Removing /usr/bin/link.exe since it will conflict with our MSVC paths..."
      rm -rf /usr/bin/link.exe

  - name: Setup MSVC Compiler
    uses: ilammy/msvc-dev-cmd@v1

  - name: Build Frontend
    shell: bash
    run: |
      cd frontend

      Qt6_DIR="${RUNNER_TEMP}\qt\${{ env.qtVersion }}\msvc2019_64"

      cmake --preset ci-windows
      cmake --build --preset build

  - name: Deploy Runtime Libs
    shell: bash
    run: |
      cd frontend/build/bin
      windeployqt.exe jv2.exe

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: ${{ env.pythonVersion }}

  - name: Build Backend
    shell: bash
    run: |
      set -ex

      python3 -m pip install nuitka

      cd backend
      cp pyproject.toml.win pyproject.toml
      python3 -m pip install .

      python3 -m nuitka --standalone --onefile --assume-yes-for-downloads src/jv2backend

  - name: Upload Raw Build Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: windows-build
      path: |
        ${{ github.workspace }}\frontend\build\bin
        ${{ github.workspace }}\backend
      if-no-files-found: error

