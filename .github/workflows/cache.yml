name: Generate Caches

on:
  workflow_dispatch:
    inputs:
      cacheLinux:
        type: boolean
        default: true
      cacheWindows:
        type: boolean
        default: true

jobs:

  Cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Environment Variables
      uses: "./.github/workflows/setup"
    - name: "Build (${{ matrix.os }})"
      uses: "./.github/workflows/build"
      with:
        linuxEnabled: ${{ inputs.cacheLinux }}
        windowsEnabled: ${{ inputs.cacheWindows }}
        linuxCacheOnly: ${{ inputs.cacheLinux }}
        windowsCacheOnly: ${{ inputs.cacheWindows }}
