name: Build and Package

on:
  workflow_call:

jobs:

  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Environment Variables
      uses: "./.github/workflows/setup"
    - name: "Build (${{ matrix.os }})"
      uses: "./.github/workflows/build"

  Package:
    needs: Build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Environment Variables
      uses: "./.github/workflows/setup"
    - name: "Package (${{ matrix.os }})"
      uses: "./.github/workflows/package"
